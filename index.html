<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>LuviLet3D | Catálogo de Impressões</title>
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

<header>
    <img src="assets/logo.png" alt="LuviLet3D Logo" class="logo">
    <div class="search-bar">
        <input type="text" id="busca" placeholder="Pesquisar produto (ex: agua)..." oninput="filtrar()">
        <select id="filtroCat" onchange="filtrar()">
            <option value="">Todas as Categorias</option>
        </select>
        <select id="filtroParceiro" onchange="filtrar()">
            <option value="">Todos os Parceiros</option>
        </select>
    </div>
</header>

<main id="catalogo" class="grid-produtos">
    </main>

<div id="carrinho-flutuante" onclick="abrirModalCart()">
    🛒 <span id="cart-count">0</span> itens
</div>

<div id="modal-quantidade" class="modal">
    <div class="modal-content">
        <h3>Quantidade</h3>
        <p id="nome-prod-modal"></p>
        <input type="number" id="input-qtd" value="1" min="1">
        <div class="modal-btns">
            <button class="btn-confirmar" onclick="confirmarAdicao()">Adicionar</button>
            <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<div id="modal-cart" class="modal">
    <div class="modal-content" style="width: 90%; max-width: 500px;">
        <h3>Seu Carrinho</h3>
        <div id="lista-carrinho" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
            </div>
        <div id="total-carrinho" style="font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; color: var(--laranja);">
            Total: R$ 0,00
        </div>
        <div id="modal-endereco" class="modal">
            <div class="modal-content largo"> <h3 style="color: var(--preto); border-bottom: 2px solid var(--laranja); padding-bottom: 10px;">
                    📍 Cadastrar Endereço
                </h3>
                
                <div class="form-endereco">
                    <div class="row">
                        <input type="text" id="end-cep" placeholder="CEP (Apenas números)" onblur="buscarCEP()" style="flex: 2;">
                        <input type="text" id="end-numero" placeholder="Nº" style="flex: 1;">
                    </div>
                    
                    <input type="text" id="end-rua" placeholder="Rua / Logradouro">
                    <input type="text" id="end-bairro" placeholder="Bairro">
                    <input type="text" id="end-cidade" placeholder="Cidade - UF" readonly style="background: #eee; cursor: not-allowed;">
                    
                    <div class="modal-btns" style="margin-top: 15px;">
                        <button class="btn-confirmar" onclick="salvarEndereco()">Salvar Endereço</button>
                        <button class="btn-cancelar" style="background:#888; color: white;" onclick="limparFormEnd()">Limpar</button>
                        <button class="btn-cancelar" onclick="fecharModalEnd()">Fechar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="checkout-opcoes" style="text-align: left; padding: 10px; border-top: 1px solid #ddd;">
            <label><b>Forma de Pagamento:</b></label><br>
            <select id="forma-pagamento" onchange="toggleParcelas()" style="width: 100%; margin: 5px 0;">
                <option value="Pix">Pix</option>
                <option value="Crédito">Cartão de Crédito</option>
            </select>
            
            <div id="div-parcelas" style="display:none;">
                <label>Parcelas:</label>
                <select id="qtd-parcelas" style="width: 100%; margin: 5px 0;">
                    <option value="1">1x (à vista)</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                </select>
            </div>

            <div id="sessao-endereco" style="margin-top: 10px;">
                <label><b>Entrega:</b></label>
                <div id="end-selecionado" style="font-size: 0.85rem; color: #666; margin: 5px 0;">Nenhum endereço cadastrado.</div>
                <button class="btn-add" style="font-size: 0.7rem; padding: 5px;" onclick="abrirModalEnd()">+ Endereço</button>
            </div>
        </div>
        <div class="modal-btns-vertical" style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn-confirmar" onclick="abrirCheckout()">Confirmar Checkout (WhatsApp)</button>
            <button class="btn-cancelar" style="background: #555; color: white;" onclick="fecharCart()">Continuar Comprando</button>
            <button class="btn-cancelar" style="background: #d9534f; color: white;" onclick="limparCarrinho()">Limpar Carrinho</button>
        </div>
    </div>
</div>

<script src="script.js?v=1.0"></script>
</body>
</html>
