<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://luvilet3d.com.br">
    <meta property="og:title" content="LuviLet3D">
    <meta property="og:description" content="Produtos personalizados para você ou para o seu negócio.">
    <meta property="og:image" content="https://luvilet3d.com.br/assets/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>LuviLet3D | Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css?v=1.3">
</head>
<body>

<header>
    <img src="assets/logo.png" alt="LuviLet3D Logo" class="logo">
    <div class="search-bar">
        <input type="text" id="busca" placeholder="Pesquisar produto (ex: Suporte)..." oninput="filtrar()">
        <select id="filtroCat" onchange="filtrar()">
            <option value="">Todas as Categorias</option>
        </select>
        <select id="filtroParceiro" onchange="filtrar()" style="display: none;">
            <option value="">Todos os Parceiros</option>
        </select>
        <button id="btn-personalizado" onclick="abrirModalPersonalizado()">✨ Pedido Personalizado</button>
    </div>
</header>

<main id="catalogo" class="grid-produtos">
</main>

<div id="carrinho-flutuante" onclick="abrirModalCart()">
    🛒 <span id="cart-count">0</span> itens
</div>

<!-- MODAL QUANTIDADE (Atualizado) -->
<div id="modal-quantidade" class="modal">
    <div class="modal-content">
        <h3>Configurar Produto</h3>
        <p id="nome-prod-modal" style="font-weight: bold; color: var(--preto);"></p>
        
        <!-- NOVO: Container onde as opções de cores serão injetadas -->
        <div id="container-variantes" style="margin-top: 15px; text-align: left;"></div>

        <input type="number" id="input-qtd" value="1" min="1">
        <div class="modal-btns">
            <button class="btn-confirmar" onclick="confirmarAdicao()">Adicionar</button>
            <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<!-- MODAL CARRINHO -->
<div id="modal-cart" class="modal">
    <div class="modal-content largo">
        <h3>Seu Carrinho</h3>
        <div id="lista-carrinho" style="max-height: 280px; overflow-y: auto; margin-bottom: 15px;">
        </div>
        
        <div id="total-carrinho" style="font-weight: 700; font-size: 1.2rem; margin-bottom: 20px; color: var(--laranja);">
            Total: R$ 0,00
        </div>

        <div class="checkout-opcoes">
            <label><b>Forma de Pagamento:</b></label>
            <select id="forma-pagamento" onchange="toggleParcelas()">
                <option value="Pix">Pix</option>
                <option value="Crédito">Cartão de Crédito</option>
            </select>
            
            <div id="div-parcelas" style="display:none;">
                <label>Parcelas:</label>
                <select id="qtd-parcelas">
                    <option value="1">1x (à vista)</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                </select>
            </div>

            <div id="sessao-endereco">
                <label><b>Entrega:</b></label>
                <div id="end-selecionado" style="font-size: 0.85rem; color: #475569; margin: 4px 0;">Nenhum endereço cadastrado.</div>
                <button class="btn-add" onclick="abrirModalEnd()">+ Endereço</button>
            </div>
        </div>

        <div class="modal-btns-vertical">
            <button class="btn-confirmar" onclick="abrirCheckout()">Confirmar Checkout (WhatsApp)</button>
            <button class="btn-cancelar" onclick="fecharCart()">Continuar Comprando</button>
            <button class="btn-cancelar" style="background: #ef4444; color: white;" onclick="limparCarrinho()">Limpar Carrinho</button>
        </div>
    </div>
</div>

<!-- MODAL CADASTRO ENDEREÇO -->
<div id="modal-endereco" class="modal">
    <div class="modal-content largo"> 
        <h3 style="border-bottom: 2px solid var(--laranja); padding-bottom: 10px; margin-bottom: 15px;">
            📍 Cadastrar Endereço
        </h3>
        
        <div class="form-endereco">
            <div class="row">
                <input type="text" id="end-cep" placeholder="CEP (Apenas números)" onblur="buscarCEP()" style="flex: 2;">
                <input type="text" id="end-numero" placeholder="Nº" style="flex: 1;">
            </div>
            
            <input type="text" id="end-rua" placeholder="Rua / Logradouro">
            <input type="text" id="end-complemento" placeholder="Complemento (Apto, Bloco, etc.) - Opcional">
            <input type="text" id="end-bairro" placeholder="Bairro">
            <input type="text" id="end-cidade" placeholder="Cidade - UF" readonly style="background: #e2e8f0; cursor: not-allowed;">
            
            <div class="modal-btns" style="margin-top: 15px;">
                <button class="btn-confirmar" onclick="salvarEndereco()">Salvar Endereço</button>
                <button class="btn-cancelar" style="background:#64748b; color: white;" onclick="limparFormEnd()">Limpar</button>
                <button class="btn-cancelar" onclick="fecharModalEnd()">Fechar</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-personalizado" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--preto); font-size: 1.4rem; margin-bottom: 15px;">✨ Solicitar Projeto</h3>
        <p style="color: #475569; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5;">
            Você será redirecionado para o WhatsApp para solicitar o seu projeto ou produto personalizado. Deseja continuar?
        </p>
        <div class="modal-btns">
            <button class="btn-confirmar" onclick="confirmarRedirecionamentoPersonalizado()">Sim, quero ir</button>
            <button class="btn-cancelar" onclick="cancelarRedirecionamentoPersonalizado()">Não, voltar</button>
        </div>
    </div>
</div>

<script src="script.js?v=1.3"></script>
</body>
</html>
